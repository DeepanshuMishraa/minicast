[package]
name = "minicast"
version = "0.1.0"
edition = "2021"
description = "Minimal, resource-efficient macOS livestreaming CLI (screen + camera PiP + mic -> RTMP) backed by a single tuned ffmpeg process."
license = "MIT"

[[bin]]
name = "minicast"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
