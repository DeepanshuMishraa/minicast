[package]
name = "minicast"
version = "0.1.0"
edition = "2021"
description = "Minimal, resource-efficient macOS livestreaming CLI (screen + camera PiP + mic -> RTMP) backed by a single tuned ffmpeg process."
license = "MIT"

[[bin]]
name = "minicast"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
core-foundation = { version = "0.10", optional = true }
core-video = { version = "0.5", optional = true }
ctrlc = { version = "3", features = ["termination"] }
gpui-kit = { version = "0.7", optional = true }
gpui-pre-platform = { version = "=0.3.8", features = ["screen-capture"], optional = true }
image = { version = "0.25", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[features]
default = []
gui = ["dep:gpui-kit", "dep:image", "dep:gpui-pre-platform", "dep:core-video", "dep:core-foundation"]
